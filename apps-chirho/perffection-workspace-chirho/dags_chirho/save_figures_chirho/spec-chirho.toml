# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)
schema_chirho = "dag-spec-v0-chirho"
intent_chirho = "Validate and append one optimistic private version of the authenticated viewer's figures, or hand the review back with every reason and no effect."
surface_chirho = { ins_chirho = ["request: http_request_v1"], outs_chirho = ["page: html_partial_v1"] }
structure_chirho = [
  "the request feeds two pure nodes that classify the same bytes with one shared function, so exactly one branch is live",
  "the write branch: the pure builder emits the strict viewer-state write request or the Skipped stone; the private request-user edge reaches the least-authority viewer-state write door; the typed answer (state or conflict) reaches the figures renderer",
  "the rejection branch: the pure renderer emits the review with every reason or the Skipped stone; it reaches no effect",
  "a builtin phi merges the one live page and the private typed response remains private at the sink",
]
behaviors_chirho = [
  "anonymous requests are refused before this DAG runs",
  "figures that cannot be kept never become a viewer-state write",
  "a stale version is answered with a typed conflict: the head is unchanged and her attempt is handed back",
  "an unverifiable answer is reported as unknown, never as saved, and is never retried",
  "it never changes her page and never publishes",
]
