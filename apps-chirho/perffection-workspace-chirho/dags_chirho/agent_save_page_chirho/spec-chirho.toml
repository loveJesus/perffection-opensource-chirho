# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
schema_chirho = "dag-spec-v0-chirho"
intent_chirho = "Validate and append one optimistic private page version for the authenticated caller's agent, or refuse with the field named and no effect, answering JSON."
surface_chirho = { ins_chirho = ["request: http_request_v1"], outs_chirho = ["answer: json_v1"] }
structure_chirho = [
  "the request feeds two pure builders that classify the same bytes with one shared function, so exactly one branch is live",
  "the write branch: the pure builder emits the strict viewer-state write request or the Skipped stone; the private request-user edge reaches the least-authority viewer-state write door; the typed answer (state or conflict) reaches the JSON outcome renderer",
  "the refusal branch: the pure renderer emits the JSON refusal or the Skipped stone; it reaches no effect",
  "a builtin phi merges the one live answer and the private typed response remains private at the sink",
]
behaviors_chirho = [
  "anonymous requests and invalid keys are refused before this DAG runs",
  "a body over the bound, unreadable, of another schema, or not a complete valid page cannot become a viewer-state write; the refusal names every field and echoes nothing",
  "nothing is clamped, stripped or repaired: only the stated normalization her browser's save also applies",
  "the host answers a stale optimistic version with a typed conflict instead of overwriting a newer draft; the agent is told the head version",
  "a successful append answers the exact new private version and the page as stored, without publishing it",
]
