# For God so loved the world, that He gave His only begotten Son, that whoever believes in Him should not perish but have eternal life. - John 3:16
#
# App-level descriptor for perffection.com — the product, built as a cairn app on the generic engine.
# tree-build combines this with the dag tree to emit the app-source manifest.
schema_chirho = "app-descriptor-v0-chirho"
app_chirho = "perffection"
owner_chirho = "owner/replace-with-local-owner-principal"
package_chirho = "perffection-site-chirho"
request_access_policy_chirho = "public"

# The one compiled stylesheet for the front door. Source is styles_chirho/system-chirho/*.scss plus
# styles_chirho/pages-chirho/home-chirho.scss, compiled in the order set by
# scripts-chirho/build-site-chirho.sh. Never hand-edit the .css.
[[asset_chirho]]
name_chirho = "home-chirho.css"
path_chirho = "assets_chirho/home-chirho.css"
content_type_chirho = "text/css"

# The compiled stylesheet for /craft-chirho. Same ordered system sources as the front door, plus
