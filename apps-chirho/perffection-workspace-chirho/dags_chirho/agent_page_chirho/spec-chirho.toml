schema_chirho = "dag-spec-v0-chirho"
intent_chirho = "Answer the authenticated caller's agent with the surface description, her exact current private page and the version to save against, as JSON."
surface_chirho = { ins_chirho = ["request: http_request_v1"], outs_chirho = ["answer: json_v1"] }
structure_chirho = [
  "the pure builder chooses one fixed logical key but cannot choose the app or viewer scope",
  "the private request-user edge reaches the least-authority viewer-state read door",
  "the private typed response reaches the JSON renderer and remains private at the sink",
]
behaviors_chirho = [
  "anonymous requests and invalid keys are refused before this DAG runs",
