# The public root keeps its private-by-default input mode and explicitly refuses request bodies before
# body collection, sealing, or runtime persistence. Cairn's empty-body guard converts a bodyless GET
# to one constant public input before sealing. Measured on the release engine: a cold first render is
# finite and repeated warm GETs have zero full-root content delta.
# The sign-in-only route below posts to canonical Cairn auth, never to a product effect.

# The landing page served at the app root.
[root_chirho]
dag_chirho = "view_home_chirho"
input_mode_chirho = "private-blob-ref"
subject_chirho = "app/perffection/home-intake-chirho"
request_body_policy_chirho = "no-body"
route_label_chirho = "perffection-chirho"

# The craft page. Same policy posture as the root: it renders no form, accepts no request body, and
# keeps the private-by-default input mode so nothing a visitor sends could be persisted in plaintext.
[[route_chirho]]
route_chirho = "craft-chirho"
dag_chirho = "view_craft_chirho"
input_mode_chirho = "private-blob-ref"
subject_chirho = "app/perffection/craft-intake-chirho"
request_body_policy_chirho = "no-body"

# The trust page. Same policy posture as every other route here: it renders no form, accepts no
# request body, and keeps the private-by-default input mode.
[[route_chirho]]
route_chirho = "trust-chirho"
dag_chirho = "view_trust_chirho"
input_mode_chirho = "private-blob-ref"
subject_chirho = "app/perffection/trust-intake-chirho"
request_body_policy_chirho = "no-body"

# Public form display only. Credentials go directly to Cairn's canonical login POST, not this DAG.
[[route_chirho]]
route_chirho = "login-chirho"
dag_chirho = "view_login_chirho"
input_mode_chirho = "private-blob-ref"
subject_chirho = "app/perffection/login-display-chirho"
request_body_policy_chirho = "no-body"

# The emailed invitation's Set-up page (R12): public form display only. Its one form posts the sign-in name, the
# setup code and a first password straight to Cairn's recover road (R2b), never to this DAG; it ships with the
# engine release that serves that road.
[[route_chirho]]
route_chirho = "setup-chirho"
dag_chirho = "view_setup_chirho"
input_mode_chirho = "private-blob-ref"
subject_chirho = "app/perffection/setup-display-chirho"
request_body_policy_chirho = "no-body"

# Public, actionless customer guidance. This display cannot read a private draft or take an action.
[[route_chirho]]
route_chirho = "help-chirho"
dag_chirho = "view_help_chirho"
input_mode_chirho = "private-blob-ref"
subject_chirho = "app/perffection/help-display-chirho"
request_body_policy_chirho = "no-body"

# The former manual agent guide is deliberately unbound. Reusable rendering source and the
# shared instruction remain; authenticated JSON authoring belongs to the workspace app.
