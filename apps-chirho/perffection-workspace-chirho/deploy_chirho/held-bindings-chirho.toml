# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
#
# Route bindings held out of app-chirho.toml until the product pin's engine carries what they read. A gate writes
# a binding into its own scratch staging only, by stage (scripts-chirho/lib-chirho/compose-held-app-chirho.py);
# the real app keeps its deployed DAG. Activating one is a reviewed change to app-chirho.toml, never this file.
#
# The Account route reads her own keys through Cairn K3's own-keys card (read-store:own-keys-chirho/, dag
# account_keys_chirho). The pin's engine predates K3, so main keeps the held Account page (dag account_chirho).
# Stage account-connect binds the same route to account_connect_chirho instead: the same read and list, plus one link
# to the engine's own form that creates a connection (Cairn K4). Creating is bound on its own, never with the list
# alone, and a composition may choose only one binding per route.
# Workflow: spec-chirho/workflows-chirho/invite-beta-chirho/agent-api-chirho.md

[[binding_chirho]]
stage_chirho = "account"
route_chirho = "account-chirho"
dag_chirho = "account_keys_chirho"

[[binding_chirho]]
stage_chirho = "account-connect"
route_chirho = "account-chirho"
dag_chirho = "account_connect_chirho"
