# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)
#
# Release profiles: which held stages a release candidate composes, and whether her held figures routes come with it.
# HELD like the stages they name: a profile is composed only into a gate's scratch copy of app-chirho.toml
# (scripts-chirho/lib-chirho/compose-held-app-chirho.py, "profile:<name>"). Releasing one is a reviewed change to
# app-chirho.toml and the host's own disposition, never this file.
#
# connected-tools-chirho (gpt #26920): her assistant connects from her Account page. Her page's read, preview and Save
# routes open to limited keys (stage page, deploy_chirho/key-openings-chirho.toml), and the Account route is the page
# bound for creating (stage account-connect, deploy_chirho/held-bindings-chirho.toml). Her figures are absent: their
# held routes are not composed, so no figures route is deployed, offered or opened.
# Workflow: spec-chirho/workflows-chirho/invite-beta-chirho/agent-api-chirho.md

[[profile_chirho]]
profile_chirho = "connected-tools-chirho"
stages_chirho = ["page", "account-connect"]
figures_routes_chirho = false
