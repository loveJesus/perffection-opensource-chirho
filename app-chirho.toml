# Sprite sheets: the engine serves no video, so motion is a grid of frames stepped by CSS. The wake is
# 36 frames of night turning to dawn (scrubbed by scrolling the hero away), split into two sheets of
# 18 because the engine refuses any asset over 1 MiB; the seal sheet
# is 48 frames of the crystal turning once (scrubbed through the Secure band; 36 on phones). On a
# phone the town crossfades from the night still to the dawn still instead, which is lighter and
# sharper than any sheet within a low-end phone's decode budget.
