# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "perffection-page-template-chirho"
version.workspace = true
edition.workspace = true
description = "Vetted pure public-page template for the Perffection invite beta."
license.workspace = true

[dependencies]
askama.workspace = true
cairn-node-sdk-chirho.workspace = true
perffection-ui-chirho.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cairn-wasmtime-runner-chirho.workspace = true

[[example]]
name = "render_published_page_guest_chirho"
path = "examples/render_published_page_guest_chirho.rs"
crate-type = ["cdylib"]

[[example]]
name = "render_published_page_native_chirho"
path = "examples/render_published_page_native_chirho.rs"
