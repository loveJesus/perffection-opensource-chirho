# For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. - John 3:16 (KJV)

[package]
name = "perffection-workspace-chirho"
version.workspace = true
edition.workspace = true
description = "Typed private-workspace product layer and Cairn guest nodes for the Perffection invite beta."
license.workspace = true

[dependencies]
askama.workspace = true
base64.workspace = true
blake3.workspace = true
cairn-node-sdk-chirho.workspace = true
perffection-page-template-chirho.workspace = true
perffection-ui-chirho.workspace = true
serde.workspace = true
serde_json.workspace = true
# The credit view port and the pack catalog, for the held Credits page (credits_flow_chirho).
perffection-credits-chirho = { path = "../../crates-chirho/perffection-credits-chirho" }

# The tests' deterministic credit-view fixture. Under resolver 2 a dev-dependency's feature stays out of the default
# normal and guest builds; served wiring uses UnconnectedCreditViewChirho until Cairn's ledger port exists.
[dev-dependencies]
perffection-credits-chirho = { path = "../../crates-chirho/perffection-credits-chirho", features = ["test-stub-chirho"] }

# The native fuel probe's runner: conditioned on the host target, so the wasm32 guest builds the
# prepare runs never see wasmtime (its errno crate cannot compile for wasm32). Never served.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cairn-wasmtime-runner-chirho.workspace = true

